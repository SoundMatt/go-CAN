name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Cross-platform unit tests (virtual, dbc, isotp, j1939, safety) ─────────
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: go test (unit + race)
        shell: bash
        run: |
          # Exclude socketcan on non-Linux (it uses Linux syscalls)
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -count=1 -coverprofile=coverage.out ./...
          else
            go test -race -count=1 -coverprofile=coverage.out \
              $(go list ./... | grep -v socketcan)
          fi

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: coverage.out

  # ── Benchmark smoke run ───────────────────────────────────────────────────
  benchmark-smoke:
    name: Benchmark smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: go test -bench (smoke, 1 iteration)
        run: >
          go test
          -bench=.
          -benchtime=1x
          -benchmem
          -run=^$
          ./virtual/...

  # ── Short fuzz run ────────────────────────────────────────────────────────
  fuzz-short:
    name: Fuzz (short, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Clear fuzz corpus cache
        run: go clean -fuzzcache

      - name: FuzzSend (virtual)
        run: go test -fuzz=^FuzzSend$ -fuzztime=10s ./virtual/...

      - name: FuzzParse (dbc)
        run: go test -fuzz=^FuzzParse$ -fuzztime=10s ./dbc/...

  # ── SocketCAN tests (Linux only, requires vcan) ───────────────────────────
  # Uses vcan0 Linux virtual CAN interface. GitHub-hosted ubuntu-latest
  # runners do NOT ship the vcan kernel module (confirmed: "modprobe: FATAL:
  # Module vcan not found in directory /lib/modules/<runner kernel>" — it is
  # simply absent from the runner image's kernel, not a permissions or
  # capability issue modprobe flags/sudo can work around). This is a kernel-
  # module-availability limitation of the hosted runner image itself, not
  # fixable from within the workflow; a real fix would require a self-hosted
  # runner (or a runner image GitHub ships with vcan built in, which does
  # not currently exist). The test helpers skip gracefully when vcan0 is
  # unavailable so this job stays green — but "green" here routinely means
  # "skipped", not "passed", and that distinction must be loud, not just
  # visible to someone who reads the raw log.
  test-socketcan:
    name: Test (socketcan, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Load vcan module
        id: vcan
        run: |
          if sudo modprobe vcan 2>/dev/null && \
             sudo ip link add dev vcan0 type vcan 2>/dev/null && \
             sudo ip link set up vcan0; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=socketcan tests SKIPPED (not run)::vcan0 is unavailable on this runner (the vcan kernel module is not present on GitHub-hosted runner images) — the socketcan test suite's real assertions will NOT execute. A green check on this job means SKIPPED, not PASSED."
            {
              echo "## :warning: socketcan tests SKIPPED — vcan0 unavailable"
              echo
              echo "GitHub-hosted \`ubuntu-latest\` runners do not ship the \`vcan\` kernel module, so \`socketcan/*_test.go\`'s real assertions never ran in this job. **A green check here does not mean the socketcan transport was exercised.** See ROADMAP.md / this workflow's comments for background; fixing this for real requires a self-hosted runner with a vcan-capable kernel."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: go vet (socketcan)
        run: go vet ./socketcan/...

      - name: go test (socketcan, -race)
        run: go test -race -count=1 -v ./socketcan/...

  # ── Live CAN interop testing (Linux only, requires vcan + can-utils) ──────
  # Two-process self-interop — two independent go-CAN OS processes talking
  # real CAN frames over real vcan0, not two Bus values sharing memory in one
  # process — plus third-party-peer interop against Linux's own SocketCAN
  # kernel subsystem via can-utils (cangen/candump). CAN has no equivalent of
  # a second independent network stack the way DDS has CycloneDDS: the
  # kernel's own SocketCAN implementation plus can-utils *is* the real wire
  # and a genuinely independent (of go-CAN) validator. Gated behind
  # CAN_INTEROP_TESTS=1 so these tests stay absent from the fast default
  # `go test ./...` sweep and from the test-socketcan job above. Probes
  # vcan + can-utils availability first and skips cleanly (green, not red)
  # if either is unavailable, rather than hard-failing — same posture as the
  # vcan probe in test-socketcan above. As with that job, GitHub-hosted
  # runners never actually have vcan (see test-socketcan's comment above
  # for the confirmed root cause), so this job routinely skips; the probe
  # step below emits a loud ::warning:: + job-summary banner rather than a
  # silent ::notice:: so "green" is never mistaken for "ran and passed".
  can-interop:
    name: CAN interop (two-process + can-utils third-party, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Probe vcan + can-utils availability
        id: probe
        run: |
          if sudo modprobe vcan 2>/dev/null && \
             sudo ip link add dev vcan0 type vcan 2>/dev/null && \
             sudo ip link set up vcan0 && \
             sudo apt-get update -qq && \
             sudo apt-get install -y -qq can-utils; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=CAN interop tests SKIPPED (not run)::vcan0 or can-utils is unavailable on this runner (GitHub-hosted runner images do not ship the vcan kernel module) — the live two-process + can-utils interop suite will NOT execute. A green check on this job means SKIPPED, not PASSED."
            {
              echo "## :warning: CAN interop tests SKIPPED — vcan0/can-utils unavailable"
              echo
              echo "GitHub-hosted \`ubuntu-latest\` runners do not ship the \`vcan\` kernel module, so the live two-process self-interop and can-utils third-party interop suites never ran in this job. **A green check here does not mean interop was exercised.** Fixing this for real requires a self-hosted runner with a vcan-capable kernel."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: go vet (socketcan, cmd/can-interop-peer)
        if: steps.probe.outputs.available == 'true'
        run: go vet ./socketcan/... ./cmd/can-interop-peer/...

      - name: Live two-process + can-utils third-party CAN interop
        if: steps.probe.outputs.available == 'true'
        env:
          CAN_INTEROP_TESTS: "1"
        run: >
          go test -race -count=1 -v
          -run 'TestTwoProcessSelfInterop|TestReaderReportsTimeoutWhenNothingArrives|TestCanUtilsCangenIntoGoCAN|TestGoCANIntoCanUtilsCandump'
          ./socketcan/...

  # ── go-FuSa continuous-conformance lifecycle (RELAY spec §20.1.2) ──────────
  # Pinned to v0.48.0. Runs the FULL lifecycle, not a subset: static check,
  # 100% requirement traceability (traced AND tested + function-annotation
  # density), cybersecurity analysis, dependency vulnerability scan, and the
  # tool-qualification suite. Conformance must be continuously proven.
  gofusa:
    name: go-FuSa lifecycle (§20, v0.48.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.48.0

      - name: gofusa check (gate on ERROR)
        run: gofusa check ./...

      - name: Verify required evidence artifacts are present (§20.4)
        run: |
          missing=0
          for f in \
            .fusa.json \
            .fusa-reqs.json \
            .fusa-iec62443.json \
            .fusa-hara.json \
            tara.json \
            fmea.json \
            sbom.json \
            provenance.json \
            SAFETY_PLAN.md \
            SECURITY.md \
            INCIDENT-RESPONSE.md \
            THREAT_MODEL.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required evidence artifact missing: $f"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: 100% requirement traceability (traced AND tested)
        run: gofusa trace -req-coverage 100

      - name: Cybersecurity analysis
        run: gofusa cyber

      - name: Dependency vulnerability scan (OSV / ISO 21434)
        run: gofusa vuln

      - name: Tool qualification suite
        run: gofusa qualify

  # ── Dependency vulnerability scan ─────────────────────────────────────────
  # govulncheck fails the build on any vulnerability the code actually calls.
  govulncheck:
    name: govulncheck (dependency CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Publish machine-readable result
        if: always()
        run: govulncheck -format json ./... > vuln.json || true

      - name: Upload vuln report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vuln-report
          path: vuln.json

  # ── RELAY conformance gate ────────────────────────────────────────────────
  # Validates the go-can CLI version/capabilities/status output against the
  # authoritative RELAY §12 JSON Schemas. Pinned to the spec version go-CAN
  # targets (v2.0.x) so a spec bump is an explicit upgrade, not a surprise.
  relay-conform:
    name: RELAY conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Install relay CLI
        run: go install github.com/SoundMatt/RELAY/v2/cmd/relay@v2.0.4

      - name: Build go-can CLI
        run: go build -o /tmp/go-can ./cmd/cantool

      - name: relay conform --strict (fail on FAIL or WARN)
        run: relay conform --strict /tmp/go-can

      - name: relay interop --strict (behavioural equivalence vs reference, §20.2)
        run: relay interop --protocol CAN --strict /tmp/go-can

      - name: relay compare (convert-driver self-check)
        run: relay compare /tmp/go-can /tmp/go-can

      - name: relay crossbar spoke smoke test
        run: |
          cat > /tmp/crossbar.json <<'JSON'
          {
            "spokes": [
              {"name":"a","binary":"/tmp/go-can","protocol":"CAN","subscribe_args":["--iface","virtual"],"send_args":["--iface","virtual"]},
              {"name":"b","binary":"/tmp/go-can","protocol":"CAN","subscribe_args":["--iface","virtual"],"send_args":["--iface","virtual"]}
            ],
            "routes": [{"from":"a","to":["b"]}]
          }
          JSON
          relay crossbar --config /tmp/crossbar.json --duration 2s
